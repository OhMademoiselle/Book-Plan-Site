<style>

body.mm #mbar{display:flex}
body.mm #addbar,body.mm #fmt,body.mm .tools,body.mm .fold,body.mm .bar,body.mm select,body.mm .del{display:none}

body.read .tools,body.read #addbar,body.read #fmt,body.read .bar,body.read select,body.read .del,body.read .tab.new{display:none}
body.read main{padding-bottom:50px}

#toast.on{opacity:1}
body.read #toast{bottom:24px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;align-items:center;justify-content:center}
#modal.on{display:flex}
.box{background:var(--card);border-radius:14px;padding:16px;width:92%;max-width:460px;max-height:80vh;overflow:auto}
.box h3{margin:0 0 8px;font-size:17px}
.mh{margin:12px 0 4px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.it{display:block;width:100%;text-align:left;font:inherit;font-size:15px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:7px 10px;margin-bottom:4px;cursor:pointer}
.tab{line-height:20px}
.tab.new{padding:8px 13px;font-weight:600}
#tabs{max-height:84px;overflow-y:auto;align-content:flex-start;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
#tabs::-webkit-scrollbar{width:8px}

.it.dng{border-color:#d9534f;color:#d9534f}.it.dng:hover{background:rgba(217,83,79,.12)}
.blk:focus{outline:none}

<body>
<header><h1>📖 План книги</h1><div class="sr"><input id="q" type="search" placeholder="🔍 Поиск по сайту…" autocomplete="off"><div id="sres"></div></div><button id="bk" class="seg" title="Резервная копия: Google Диск или файл">☁ Копия</button><div id="mode"></div></header>
<div id="tabs"></div>
<div id="fmt"><span class="pw"><button id="plus" type="button" title="Добавить блок">+</button><div id="pp"></div></span><button id="ftog" type="button"></button><div id="fp"></div></div>
<main id="main"></main>
<div id="gate"></div>
<div id="mbar"></div>
<div id="toast"></div>
<div id="modal"></div>
<script>
const UIK='plan-knigi-ui';let S,UI={};
try{UI=JSON.parse(localStorage.getItem(UIK))||{}}catch(e){}
S={v:2,active:Number(UI.active)||0,edit:UI.edit!==false,fmtOpen:!!UI.fmtOpen,tabs:[
{name:'Сюжет',blocks:[{t:'h',lv:1,x:'Название книги'},{t:'p',x:'Коротко: о чём эта история?'},{t:'warn',y:'w',x:'Не забыть: связать завязку с финалом.'}]},
{name:'Герои',blocks:[{t:'cards',cards:[{a:'Главный герой',b:'Цель, страх, характер…'},{a:'Антагонист',b:'Что им движет?'}]}]}]};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
if(S.v!==2){S.tabs.forEach(t=>t.blocks.forEach(b=>{if('x' in b)b.x=esc(b.x||'');if(b.rows)b.rows=b.rows.map(r=>r.map(esc));if(b.cards)b.cards.forEach(c=>{c.a=esc(c.a||'');c.b=esc(c.b||'')})}));S.v=2}
S.tabs.forEach(t=>t.blocks.forEach(b=>{b.id=b.id||uid()}));
if(typeof S.edit!=='boolean')S.edit=true;
if(S.active>=S.tabs.length)S.active=0;
try{document.execCommand('defaultParagraphSeparator',false,'br')}catch(e){}
const save=()=>{try{localStorage.setItem(UIK,JSON.stringify({active:S.active,edit:S.edit,fmtOpen:S.fmtOpen}))}catch(e){}};
const upd=()=>{commit();save();render()};
