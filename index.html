<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#2b2a28;--mut:#8a857d;--bd:#e4dfd7;--ac:#6b5bd2;--acbg:#efecfb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b1a;--card:#262523;--tx:#eceae6;--mut:#9a958c;--bd:#3a3835;--ac:#a99cff;--acbg:#2e2b45}}
:root[data-theme="dark"]{--bg:#1c1b1a;--card:#262523;--tx:#eceae6;--mut:#9a958c;--bd:#3a3835;--ac:#a99cff;--acbg:#2e2b45}
:root[data-theme="sakura"]{--bg:#fff3f6;--card:#fffafb;--tx:#3b2a31;--mut:#9a7b86;--bd:#f1d4dc;--ac:#d6457a;--acbg:#fde3ec;--onac:#fff;color-scheme:light}
:root[data-theme="forest"]{--bg:#eff4eb;--card:#fafcf7;--tx:#22301f;--mut:#6b7f64;--bd:#d0dcc6;--ac:#3b8450;--acbg:#dcefd9;--onac:#fff;color-scheme:light}
:root[data-theme="sunset"]{--bg:#fff2e5;--card:#fffaf3;--tx:#3a2418;--mut:#9b7a63;--bd:#f0d4ba;--ac:#e0562f;--acbg:#fddfce;--onac:#fff;color-scheme:light}
:root[data-theme="coffee"]{--bg:#ece0cd;--card:#f6eddf;--tx:#3b2e22;--mut:#85715b;--bd:#d6c5aa;--ac:#8a5628;--acbg:#e7d8bf;--onac:#fff;color-scheme:light}
:root[data-theme="ocean"]{--bg:#0e1d2a;--card:#152a3b;--tx:#e3f0f9;--mut:#84a3b8;--bd:#244059;--ac:#4fc3f7;--acbg:#173a52;--onac:#06222f;color-scheme:dark}
:root[data-theme="neon"]{--bg:#0d0b1a;--card:#171330;--tx:#f1eaff;--mut:#9c8fc9;--bd:#2f2764;--ac:#ff4fd8;--acbg:#2b1650;--onac:#1a0518;color-scheme:dark}
:root[data-theme="terminal"]{--bg:#050805;--card:#0b120b;--tx:#b6ffb6;--mut:#5fa05f;--bd:#1c3a1c;--ac:#39ff14;--acbg:#0f2a0f;--onac:#021002;color-scheme:dark}
:root[data-theme="terminal"] body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.thg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:4px}
.thb{display:flex;align-items:center;gap:8px;font:inherit;font-size:14px;text-align:left;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:6px 8px;cursor:pointer}
.thb.on{border-color:var(--ac)}
.thb i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(128,128,128,.5);flex:none}
.sett-note{margin:2px 0 6px;font-size:14px;color:var(--mut);word-break:break-all}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 20px 12px;max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:20px}
.logo{display:flex;align-items:center;gap:10px}
header h1.logo{font-size:23px}
.lgm{width:38px;height:38px;flex:none;border-radius:11px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.lgt{font-family:Georgia,"Times New Roman",serif;line-height:1;letter-spacing:.2px;white-space:nowrap}
.lgt b{font-weight:700;color:var(--tx)}
.lgt i{font-style:italic;font-weight:600;color:var(--ac);margin-left:1px}
.bkw{position:relative}
.bkc{font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px;max-width:230px;padding:6px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--card);color:var(--tx);cursor:pointer}
.bkc .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bkm{display:none;position:absolute;left:0;top:100%;margin-top:6px;z-index:30;width:min(320px,92vw);padding:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.bkm.on{display:block}
.bkm .bl{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-bottom:2px}
.bki{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;font-size:15px;border:none;background:transparent;color:var(--tx);padding:8px 10px;border-radius:8px;cursor:pointer}
.bki:hover:not(:disabled){background:var(--acbg)}.bki.on{font-weight:600;background:var(--acbg)}.bki:disabled{opacity:.4;cursor:default}.bki.dng{color:#d9534f}
.bkm hr{border:none;border-top:1px solid var(--bd);margin:6px 0}
.bkm p{margin:4px 2px;font-size:14px;color:var(--mut)}
.bkm input[type=text]{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:4px 0}
.bkm .bkchk{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 2px}
.bkm .bf{display:flex;gap:6px;margin-top:8px}
.bkm .bf button{flex:1;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
